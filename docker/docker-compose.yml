# =============================================================================
# Tuki — Docker Compose
# Development environment with FastAPI, PostGIS, and Redis
# =============================================================================

services:
  # --- FastAPI Backend ---
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: tuki-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:tuki_dev@db:5432/tuki
      - APP_ENV=development
      - APP_DEBUG=true
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../apps/backend/app:/app/app  # Hot reload
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - tuki-network

  # --- PostgreSQL + PostGIS ---
  db:
    image: postgis/postgis:16-3.4
    container_name: tuki-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: tuki_dev
      POSTGRES_DB: tuki
    volumes:
      - tuki-db-data:/var/lib/postgresql/data
      - ../database/sql/001_create_tables.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ../database/sql/002_rls_policies.sql:/docker-entrypoint-initdb.d/02-rls.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tuki-network

  # --- Redis (placeholder for caching/queues) ---
  redis:
    image: redis:7-alpine
    container_name: tuki-redis
    ports:
      - "6379:6379"
    volumes:
      - tuki-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tuki-network

volumes:
  tuki-db-data:
  tuki-redis-data:

networks:
  tuki-network:
    driver: bridge
